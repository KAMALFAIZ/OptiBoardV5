<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e40af" />
  <title>Hors ligne — OptiBoard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      background: #f3f4f6; color: #111827;
      padding: 24px env(safe-area-inset-right) 24px env(safe-area-inset-left);
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f9fafb; }
      .card { background: #1f2937 !important; }
      p { color: #9ca3af !important; }
    }
    .card {
      background: #ffffff; border-radius: 16px; padding: 40px 32px;
      max-width: 380px; width: 100%; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    .logo {
      width: 64px; height: 64px; border-radius: 14px; background: #1e40af;
      color: #fff; font-size: 34px; font-weight: 700; line-height: 64px;
      margin: 0 auto 20px;
    }
    h1 { font-size: 20px; margin-bottom: 10px; }
    p { font-size: 14px; color: #6b7280; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #1e40af; color: #fff; border: none; border-radius: 10px;
      padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer;
      min-height: 44px;
    }
    button:active { opacity: .85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">K</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Impossible de joindre le serveur OptiBoard.<br />Vérifiez votre connexion réseau puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
  <script>
    window.addEventListener('online', function () { location.reload() })
  </script>
</body>
</html>
