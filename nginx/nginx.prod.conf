# ============================================================
# OptiBoard v5 — Nginx Production Config
# ============================================================

# ── Rate limiting ─────────────────────────────────────────
# (ce fichier est inclus dans le contexte http via conf.d)
# api_limit   : usage normal — genereux car un dashboard charge
#               plusieurs widgets en parallele, et un bureau entier
#               peut partager la meme IP publique.
# login_limit : anti brute-force sur le login.
limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/m;

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    # Routage SaaS par sous-domaine : un tenant = un sous-domaine
    # (acme.optiboard.kasoft.ma). Le wildcard capte tous les tenants ;
    # le domaine nu sert le login central.
    server_name *.optiboard.kasoft.ma optiboard.kasoft.ma;

    # SSL — REQUIERT un certificat WILDCARD *.optiboard.kasoft.ma
    # (Let's Encrypt via challenge DNS-01, ou certificat custom).
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Frontend (React SPA) ──────────────────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;   # React Router support

        # Cache assets statiques
        # NB: add_header dans une location annule ceux du niveau server
        # -> on redeclare les en-tetes de securite utiles ici.
        location ~* \.(js|css|png|jpg|ico|svg|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    # ── Login : rate limit strict (anti brute-force) ──────
    location = /api/auth/login {
        limit_req zone=login_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Session-Token, X-DWH-Code, X-User-Id, X-Societe-Code, X-Data-Source" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── Backend API (proxy vers FastAPI) ─────────────────
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # CORS headers (si non géré par FastAPI)
        # En prod, frontend et API partagent le même sous-domaine (same-origin) ;
        # ces en-têtes couvrent les éventuels appels inter-sous-domaines.
        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Session-Token, X-DWH-Code, X-User-Id, X-Societe-Code, X-Data-Source" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── WebSocket support (si utilisé) ──────────────────
    location /ws/ {
        proxy_pass          http://backend:8080;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
    }

    # Security headers
    # NB: herites uniquement par les locations SANS add_header propre
    # (les locations /api/, login et assets statiques les redeclarent).
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    # CSP : pas de script externe ; styles inline requis (Tailwind/Emotion/MUI) ;
    # blob:/data: requis pour les exports (Excel/PDF/PPTX) et previews.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; worker-src 'self' blob:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
}
