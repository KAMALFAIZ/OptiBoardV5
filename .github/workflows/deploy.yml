name: Deploy OptiBoard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────
  # TESTS : bloquent le deploiement production
  # (meme sous-ensemble hermetique que build-images.yml)
  # ─────────────────────────────────────────────────────────
  tests:
    name: Tests backend (gating deploy)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: reporting-commercial/backend
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unixodbc
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: reporting-commercial/backend
        env:
          DB_SERVER: ci-no-database
          DB_PASSWORD: ci
        run: |
          python -m pytest tests/test_calculs_coherence.py tests/test_auth_security.py tests/test_ai_security.py tests/test_tenant_isolation.py -q

  # ─────────────────────────────────────────────────────────
  # DEPLOY : cible l'instance backend REELLEMENT en production
  #   -> B:\Kasoft-Platform\OptiBoardV5\reporting-commercial\backend  (port 8084)
  #      C'est le backend qu'utilisent la console KASOFT (provisioning /
  #      monitoring, /api/console/*) ET les tenants OptiBoard.
  #
  #   L'ancienne version copiait vers C:\optiboard\backend (port 8080), une
  #   instance DISTINCTE jamais utilisee par la console -> les deploiements
  #   n'atteignaient jamais la prod (cause du 405 sur /api/console/*, le serveur
  #   restant N commits en retard sur origin/main).
  #
  #   Le redemarrage passe par une TACHE PLANIFIEE : un process lance directement
  #   dans un step (Start-Process) serait tue a la fermeture du job-object du
  #   runner. La tache 'OptiBoard-Backend-8084' survit au job.
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to live backend (8084)
    runs-on: self-hosted
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      # Dossier d'ou tourne REELLEMENT le backend 8084 (python run.py).
      LIVE_BACKEND: B:\Kasoft-Platform\OptiBoardV5\reporting-commercial\backend
      # Endpoint de sante du backend 8084.
      HEALTH_URL: http://127.0.0.1:8084/api
      # Tache planifiee qui (re)lance le backend 8084. Doit exister (creee une
      # fois hors CI) ; action = cmd /c "python run.py >> backend_prod.log 2>&1",
      # WorkingDirectory = LIVE_BACKEND. Une tache planifiee survit a la fin du job.
      BACKEND_TASK: OptiBoard-Backend-8084

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      # ── Backend : dependances Python (Python 3.11 systeme du serveur) ──
      - name: Install Python dependencies
        working-directory: reporting-commercial/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: powershell

      # ── Frontend : build React + deploiement IIS ─────────────────────────
      # NOTE : le frontend utilisateur est servi par IIS. Le backend 8084 ne
      # sert que l'API (sa route SPA pointe sur un template Vite non-builde).
      # Etapes conservees telles quelles — orthogonales au fix backend 8084.
      # Le runner est self-hosted : son cache npm (~400 Mo, compte SYSTEM) persiste
      # deja d'un job a l'autre. Inutile d'ajouter actions/cache — cela ferait
      # transiter le meme cache par le reseau, plus lent encore.
      #
      # Le temps passe ici n'etait PAS du telechargement : les logs npm montrent
      # 44 requetes registry "(cache revalidated)", certaines a 9 s, plus la
      # requete d'audit — soit ~10 min de latence reseau pour des paquets deja
      # presents localement. D'ou :
      #   --prefer-offline : sert les metadonnees depuis le cache, ne va sur le
      #                      reseau que pour ce qui manque reellement
      #   --no-audit       : supprime l'appel d'audit (le lockfile fait foi ici)
      #   --no-fund        : bruit en moins
      - name: Install Node dependencies
        working-directory: reporting-commercial/frontend
        run: npm ci --prefer-offline --no-audit --no-fund
        shell: powershell

      - name: Build React frontend
        working-directory: reporting-commercial/frontend
        run: npm run build
        shell: powershell
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}

      # Le dossier REELLEMENT servi par IIS n'est pas toujours
      # C:\inetpub\wwwroot\optiboard : selon l'installation c'est
      # C:\inetpub\optiboard (cf. DEPLOY.ps1 / DEPLOY_PACKAGE.ps1). Copier dans
      # le mauvais dossier laisse un backend a jour et une interface figee, sans
      # que rien ne le signale (interface amm.kasoft.ma figee au 31/07/2026).
      # On deploie donc dans TOUS les dossiers OptiBoard montes par IIS, et on
      # verifie que le nouveau bundle y est bien arrive.
      #
      # robocopy /E (pas /MIR) : ne supprime rien. Le dossier servi contient des
      # fichiers absents du build (web.config des regles de reecriture SPA) que
      # /MIR effacerait. Les anciens assets restent, inoffensifs (noms hashes).
      # ── Diagnostic : inventaire IIS (lecture seule) ──────────────────────
      # Le 22/09/2026, un deploiement "success" n'atteignait toujours pas le
      # site servi : optiboard.kasoft.ma / amm.kasoft.ma renvoyaient encore le
      # bundle du 09/09 alors que le job copiait dans C:\inetpub\optiboard et
      # C:\inetpub\wwwroot\optiboard. Sans inventaire dans les logs, ce genre
      # d'ecart est invisible. Cette etape n'ecrit rien : elle liste les sites,
      # leurs bindings et leur chemin physique pour identifier la vraie cible.
      - name: Inventaire IIS (diagnostic)
        continue-on-error: true
        run: |
          try {
            Import-Module WebAdministration -ErrorAction Stop
          } catch {
            Write-Host "WebAdministration indisponible : $($_.Exception.Message)"
            exit 0
          }
          Get-Website | ForEach-Object {
            $p = $_.physicalPath
            if ($p) { $p = [System.Environment]::ExpandEnvironmentVariables($p) }
            $bindings = ($_.bindings.Collection | ForEach-Object { $_.bindingInformation }) -join ' | '
            $bundle = ''
            $idx = if ($p) { Join-Path $p 'index.html' } else { $null }
            if ($idx -and (Test-Path $idx)) {
              $m = Select-String -Path $idx -Pattern 'assets/index-[^"]+\.js' -AllMatches |
                   Select-Object -First 1
              if ($m) { $bundle = $m.Matches[0].Value }
            }
            "SITE {0,-24} etat={1,-8} chemin={2} bindings=[{3}] bundle={4}" -f $_.name, $_.state, $p, $bindings, $bundle
          }
          # Applications et repertoires virtuels (un site peut servir la SPA
          # depuis une application enfant, pas depuis la racine du site).
          Get-WebApplication | ForEach-Object {
            "APP  {0,-24} site={1} chemin={2}" -f $_.path, $_.GetParentElement().Attributes['name'].Value, $_.physicalPath
          }
        shell: powershell

      - name: Deploy frontend to IIS
        run: |
          $src = "reporting-commercial\frontend\dist"
          if (-not (Test-Path "$src\index.html")) { Write-Error "Build frontend absent : $src"; exit 1 }

          $targets = New-Object System.Collections.Generic.List[string]
          try {
            Import-Module WebAdministration -ErrorAction Stop
            Get-Website | ForEach-Object {
              $p = $_.physicalPath
              if ($p) {
                $p = [System.Environment]::ExpandEnvironmentVariables($p)
                $idx = Join-Path $p 'index.html'
                if (Test-Path $idx) {
                  # Le nom du dossier ne suffit pas : le site servi peut
                  # s'appeler autrement (cause du deploiement fantome du 22/09).
                  # On retient toute racine dont l'index.html EST deja une SPA
                  # OptiBoard (marqueur dans le HTML + bundle Vite) : un site
                  # tiers ne remplit pas les deux conditions.
                  $html = Get-Content $idx -Raw -ErrorAction SilentlyContinue
                  $estOptiBoard = $html -match 'OptiBoard' -and $html -match 'assets/index-'
                  if ($p -match 'optiboard' -or $estOptiBoard) {
                    $targets.Add((Resolve-Path $p).Path)
                  }
                }
              }
            }
            # Idem pour les applications IIS enfants (ex : site 'Default Web
            # Site' avec une application /optiboard montee ailleurs).
            Get-WebApplication | ForEach-Object {
              $p = $_.physicalPath
              if ($p) {
                $p = [System.Environment]::ExpandEnvironmentVariables($p)
                $idx = Join-Path $p 'index.html'
                if ((Test-Path $idx)) {
                  $html = Get-Content $idx -Raw -ErrorAction SilentlyContinue
                  if ($html -match 'OptiBoard' -and $html -match 'assets/index-') {
                    $targets.Add((Resolve-Path $p).Path)
                  }
                }
              }
            }
          } catch {
            Write-Host "WebAdministration indisponible : $($_.Exception.Message)"
          }

          # Candidats connus, meme s'ils ne sont pas (ou plus) montes dans IIS.
          foreach ($c in @("C:\inetpub\optiboard", "C:\inetpub\wwwroot\optiboard")) {
            if (Test-Path (Join-Path $c 'index.html')) { $targets.Add((Resolve-Path $c).Path) }
          }

          $targets = @($targets | Sort-Object -Unique)
          if ($targets.Count -eq 0) {
            $fallback = "C:\inetpub\wwwroot\optiboard"
            New-Item -ItemType Directory -Path $fallback -Force | Out-Null
            $targets = @($fallback)
            Write-Host "Aucun dossier frontend existant detecte -> creation de $fallback"
          }

          $newIndex = (Get-ChildItem "$src\assets" -Filter 'index-*.js' | Select-Object -First 1).Name
          foreach ($dest in $targets) {
            Write-Host "Deploiement frontend -> $dest"
            robocopy $src $dest /E /NFL /NDL /NJH /NJS /NP /R:2 /W:2 | Out-Null
            if ($LASTEXITCODE -ge 8) { Write-Error "robocopy frontend a echoue ($dest, code $LASTEXITCODE)"; exit 1 }
            if (-not (Test-Path (Join-Path $dest "assets\$newIndex"))) {
              Write-Error "Bundle $newIndex absent de $dest apres copie"
              exit 1
            }
          }
          Write-Host "Frontend deploye ($newIndex) dans : $($targets -join ', ')"
          "NEW_INDEX=$newIndex" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # robocopy laisse un code 1 (fichiers copies) dans $LASTEXITCODE, que
          # le runner interprete comme un echec du step. Meme 'exit 0' final que
          # l'etape backend ci-dessous.
          exit 0
        shell: powershell

      # ── Backend : copie vers l'instance LIVE 8084 ────────────────────────
      # robocopy SANS /MIR : met a jour les fichiers suivis, ne supprime RIEN.
      # .env (token console, gitignore), logs, uploads et __pycache__ sont
      # preserves (/XF /XD par securite : ils ne sont de toute facon pas dans
      # le checkout propre du runner).
      - name: Deploy backend to live 8084 instance
        run: |
          $src  = "reporting-commercial\backend"
          $dest = "$env:LIVE_BACKEND"
          Write-Host "Copie $src -> $dest"
          robocopy $src $dest /E /XF .env *.log *.pyc /XD __pycache__ .git logs uploads /NFL /NDL /NP /R:2 /W:2
          $rc = $LASTEXITCODE
          if ($rc -ge 8) { Write-Error "robocopy a echoue (code $rc)"; exit 1 }
          Write-Host "Backend copie dans $dest (robocopy=$rc)"
          exit 0
        shell: powershell

      # ── Redemarrage du backend 8084 via tache planifiee ──────────────────
      - name: Restart backend (scheduled task)
        run: |
          $task = "$env:BACKEND_TASK"
          $t = Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue
          if (-not $t) {
            Write-Error "Tache planifiee '$task' introuvable. La creer une fois (voir docs deploy) : action cmd /c 'python run.py >> backend_prod.log 2>&1', WorkingDirectory=$env:LIVE_BACKEND. Deploiement interrompu."
            exit 1
          }
          # Stopper le process 8084 courant (la tache le relance proprement)
          Get-NetTCPConnection -LocalPort 8084 -State Listen -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty OwningProcess -Unique |
            ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
          Stop-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Start-ScheduledTask -TaskName $task
          Write-Host "Tache '$task' relancee."
        shell: powershell

      # ── Health check sur le VRAI port (8084) ─────────────────────────────
      - name: Health check (8084)
        run: |
          $ok = $false
          for ($i = 0; $i -lt 12; $i++) {
            Start-Sleep -Seconds 5
            try {
              $r = Invoke-WebRequest -Uri "$env:HEALTH_URL" -UseBasicParsing -TimeoutSec 10
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if ($ok) {
            Write-Host "Backend 8084 OK"
          } else {
            Write-Error "Backend 8084 ne repond pas apres redemarrage"
            Get-Content "$env:LIVE_BACKEND\backend_prod.log" -Tail 40 -ErrorAction SilentlyContinue
            exit 1
          }
        shell: powershell

      # ── Reload IIS (frontend) ────────────────────────────────────────────
      - name: Reload IIS
        run: iisreset /noforce
        shell: cmd

      # ── Verification PUBLIQUE : le site servi a-t-il vraiment change ? ────
      # Un job "success" ne prouve rien si la copie atterrit dans un dossier que
      # personne ne sert (constate le 22/09/2026 : bundle du 09/09 encore en
      # ligne apres plusieurs deploiements verts). On interroge donc les URL
      # publiques et on compare le bundle reellement servi a celui deploye.
      # Hotes surchargeables par la variable de depot PUBLIC_URLS (separes par
      # des virgules). Diagnostic uniquement : n'echoue pas le deploiement.
      - name: Verification publique du bundle
        continue-on-error: true
        run: |
          $urls = "${{ vars.PUBLIC_URLS }}"
          if (-not $urls) { $urls = 'https://optiboard.kasoft.ma,https://amm.kasoft.ma' }
          $attendu = "$env:NEW_INDEX"
          foreach ($u in ($urls -split ',' | Where-Object { $_ -and $_.Trim() })) {
            $u = $u.Trim().TrimEnd('/')
            try {
              $html = (Invoke-WebRequest -Uri "$u/?cb=$([guid]::NewGuid())" -UseBasicParsing -TimeoutSec 20).Content
              $m = [regex]::Match($html, 'assets/index-[^"]+\.js')
              $servi = if ($m.Success) { $m.Value -replace 'assets/', '' } else { '(introuvable)' }
              if ($servi -eq $attendu) {
                Write-Host "OK   $u sert bien $attendu"
              } else {
                Write-Host "::warning::$u sert '$servi' au lieu de '$attendu' - la copie n'atteint pas le dossier servi"
              }
            } catch {
              Write-Host "::warning::$u injoignable : $($_.Exception.Message)"
            }
          }
        shell: powershell

  # ─────────────────────────────────────────────────────────
  # PR CHECK : validation syntaxe seulement
  # ─────────────────────────────────────────────────────────
  check:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: find reporting-commercial/backend -name "*.py" -exec python3 -m py_compile {} \;
      - name: Check package.json
        run: node -e "JSON.parse(require('fs').readFileSync('reporting-commercial/frontend/package.json'))"
