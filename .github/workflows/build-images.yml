name: Build & Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'reporting-commercial/backend/**'
      - 'reporting-commercial/frontend/**'
      - 'reporting-commercial/Dockerfile.*'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:   # permet de lancer manuellement depuis GitHub

env:
  REGISTRY: ghcr.io
  OWNER: kamalfaiz

jobs:
  tests:
    name: Tests backend (hermetiques)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: reporting-commercial/backend
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unixodbc
          pip install -r requirements.txt
          pip install pytest pytest-asyncio "httpx<0.28"

      # Sous-ensemble hermetique : tests qui passent SANS SQL Server.
      # (Pour etendre la couverture : rendre test_etl_agents/test_multitenant/
      #  test_data_coherence independants de la base, puis les ajouter ici.)
      - name: Run tests
        working-directory: reporting-commercial/backend
        env:
          DB_SERVER: ci-no-database
          DB_PASSWORD: ci
        run: |
          python -m pytest tests/test_calculs_coherence.py tests/test_auth_security.py tests/test_ai_security.py tests/test_tenant_isolation.py -q

  build-and-push:
    name: Build & Push images
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ────────────────────────────────────────────
      - name: Build & Push backend
        uses: docker/build-push-action@v5
        with:
          context: ./reporting-commercial
          file: ./reporting-commercial/Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/optiboard-backend:latest
            ghcr.io/${{ env.OWNER }}/optiboard-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ───────────────────────────────────────────
      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./reporting-commercial
          file: ./reporting-commercial/Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/optiboard-frontend:latest
            ghcr.io/${{ env.OWNER }}/optiboard-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resume
        run: |
          echo "Images publiees sur GHCR :"
          echo "  ghcr.io/${{ env.OWNER }}/optiboard-backend:latest"
          echo "  ghcr.io/${{ env.OWNER }}/optiboard-frontend:latest"
